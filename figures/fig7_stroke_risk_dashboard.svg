    <rect x="175" y="390" width="30" height="140" rx="8" fill="#5FD3C4"/>
    <rect x="220" y="470" width="30" height="60" rx="8" fill="#EDEFF2" opacity="0.8"/>
    <rect x="265" y="410" width="30" height="120" rx="8" fill="#E8A94A" opacity="0.7"/>
    <text x="145" y="395" fill="#EDEFF2" font-family="Arial, sans-serif" font-size="18" font-weight="700">Risk bands</text>
