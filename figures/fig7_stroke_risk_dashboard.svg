    <circle cx="760" cy="255" r="6" fill="#E8A94A"/>
    <circle cx="820" cy="220" r="6" fill="#E8A94A"/>
    <circle cx="885" cy="255" r="6" fill="#E8A94A"/>
    <circle cx="955" cy="180" r="6" fill="#E8A94A"/>
    <circle cx="1020" cy="210" r="6" fill="#E8A94A"/>
    <text x="770" y="150" fill="#EDEFF2" font-family="Arial, sans-serif" font-size="18" font-weight="700">BP vs BMI</text>
  </g>
