    <rect x="120" y="150" width="180" height="10" rx="5" fill="#E8A94A" opacity="0.9"/>
    <rect x="120" y="175" width="150" height="10" rx="5" fill="#5FD3C4" opacity="0.8"/>
    <rect x="120" y="200" width="125" height="10" rx="5" fill="#EDEFF2" opacity="0.75"/>
    <rect x="120" y="240" width="82" height="22" rx="11" fill="url(#amber)"/>
    <text x="138" y="256" fill="#10151B" font-family="Arial, sans-serif" font-size="13" font-weight="700">76.7%</text>
  </g>
  <g>
    <rect x="390" y="120" width="260" height="180" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)"/>
    <path d="M430 250 L470 210 L520 240 L560 180 L610 195 L610 270 L430 270 Z" fill="url(#teal)" opacity="0.75"/>
    <path d="M430 250 L470 210 L520 240 L560 180 L610 195" fill="none" stroke="#EDEFF2" stroke-width="2" opacity="0.75"/>
    <text x="430" y="150" fill="#EDEFF2" font-family="Arial, sans-serif" font-size="18" font-weight="700">Risk by group</text>
  </g>
  <g>
    <rect x="700" y="120" width="370" height="180" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)"/>
