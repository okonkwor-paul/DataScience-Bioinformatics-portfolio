<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Stroke Risk Profile Dashboard Placeholder</title>
  <desc id="desc">Placeholder visual representing a stroke risk dashboard for the Data Science Bioinformatics portfolio project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10151B"/>
      <stop offset="100%" stop-color="#1D2733"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8A94A"/>
      <stop offset="100%" stop-color="#F0CE93"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5FD3C4"/>
      <stop offset="100%" stop-color="#2FAEA3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <g fill="none" stroke="rgba(237,239,242,0.12)" stroke-width="1">
    <path d="M80 90H1120M80 220H1120M80 350H1120M80 480H1120M80 610H1120"/>
    <path d="M220 90V610M420 90V610M620 90V610M820 90V610M1020 90V610"/>
  </g>
  <g>
    <text x="80" y="60" fill="#EDEFF2" font-family="Arial, sans-serif" font-size="28" font-weight="700">Stroke Risk Profile Dashboard</text>
    <text x="80" y="660" fill="#96A0AC" font-family="Arial, sans-serif" font-size="18">Illustrative figure placeholder</text>
  </g>
  <g>
